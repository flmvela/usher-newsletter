name: Send Newsletter via Resend
on:
  push:
    paths: ['newsletter.json']
  workflow_dispatch:
jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Send
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        run: |
          if [ ! -f newsletter.json ]; then
            echo "No newsletter.json found, nothing to send"
            exit 0
          fi
          RESPONSE=$(curl -sS -w '\nHTTP:%{http_code}' -X POST 'https://api.resend.com/emails' \
            -H "Authorization: Bearer $RESEND_API_KEY" \
            -H 'Content-Type: application/json' \
            -d @newsletter.json)
          echo "$RESPONSE"
          echo "$RESPONSE" | grep -q '"id"' || exit 1
